name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Custom version name (e.g. 1.0.2)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version and Tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          elif [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION="${{ github.event.inputs.version_name }}"
            TAG="v${VERSION}"
          else
            VERSION="1.0.${{ github.run_number }}"
            TAG="v${VERSION}"
          fi
          
          CODE="${{ github.run_number }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION ($TAG, code: $CODE)"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          PRISM_KEYSTORE_PASSWORD: ${{ secrets.PRISM_KEYSTORE_PASSWORD || 'prismde-release' }}
          PRISM_KEY_ALIAS: ${{ secrets.PRISM_KEY_ALIAS || 'prismde' }}
          PRISM_KEY_PASSWORD: ${{ secrets.PRISM_KEY_PASSWORD || 'prismde-release' }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK and Generate Checksum
        id: apk_info
        shell: bash
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Release APK not found at $APK_PATH"
            exit 1
          fi
          
          SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          SIZE=$(stat -c%s "$APK_PATH")
          
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "apk_size=$SIZE" >> $GITHUB_OUTPUT
          
          echo "APK successfully built: size $SIZE bytes, SHA256: $SHA256"

      - name: Prepare Release Notes
        id: notes
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VER="${{ steps.version.outputs.version }}"
          SHA="${{ steps.apk_info.outputs.apk_sha256 }}"
          SIZE="${{ steps.apk_info.outputs.apk_size }}"
          
          echo "✨ Обновление $TAG / Update $TAG" > release_notes.md
          echo "" >> release_notes.md
          git log -1 --pretty=%s >> release_notes.md
          echo "" >> release_notes.md
          echo "📦 app-release.apk ($SIZE байт)" >> release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "PrismDE ${{ steps.version.outputs.tag }}"
          body_path: release_notes.md
          files: app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
